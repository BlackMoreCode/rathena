    - Id: 48488
      AegisName: Winky_Hat_Blue
      Name: Winky Hat Blue
      Type: Armor
      Buy: 30000
      Weight: 300
      Defense: 1
      Slots: 3
      Jobs:
          All: true
      Locations:
          Costume_Head_Top: true
      ArmorLevel: 1
      Refineable: true
      View: 5502
      Script: |
          .@r = getrefine();
          bonus bMaxHP,300;
          bonus2 bSubEle,Ele_Water,5;
          bonus2 bSubEle,Ele_Wind,5;
          bonus2 bSubEle,Ele_Earth,5;
          bonus2 bSubEle,Ele_Fire,5;
          bonus bCritical,10;
          bonus bAllStats,10;
          bonus bFlee,10+getrefine();
          bonus bUseSPrate,-15;
          bonus bCastrate,-15;
          bonus bMAtkRate,5+getrefine();
          bonus5 bAutoSpellWhenHit,"BS_HAMMERFALL",5,50,BF_WEAPON|BF_MAGIC,1;
          if (getrefine()>=7) {
             bonus2 bAddClass,Class_All,1;
             bonus bMAtkRate,1;
             bonus bHealPower,1;
             bonus bMatkRate,5;
          }
          if (getrefine()>=9) {
             bonus bCastrate,-15;
             bonus2 bSubSize, 0, 5;
             bonus2 bSubSize, 1, 5;
             bonus2 bSubSize, 2, 5;
          }
